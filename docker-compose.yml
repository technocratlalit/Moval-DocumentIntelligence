name: docs-intelligence

x-aimodule-worker: &aimodule-worker
  build:
    context: ./aimodule
    dockerfile: Dockerfile
  command: ["node", "dist/worker.js"]
  env_file:
    - .env
  environment:
    NODE_ENV: production
    STORAGE_PROVIDER: gcp
    WEBHOOK_URL: ${WEBHOOK_URL:-http://test-backend:3001/api/webhook/extraction-complete}
    WEBHOOK_URL_IN: ${WEBHOOK_URL_IN:-}
    WEBHOOK_URL_COM: ${WEBHOOK_URL_COM:-}
    RUN_WORKERS: "true"
    RUN_DLQ_WORKER: "true"
    POLICY_MAX_OUTPUT_TOKENS: ${POLICY_MAX_OUTPUT_TOKENS:-65536}
    POLICY_MAX_GEMINI_RETRIES: ${POLICY_MAX_GEMINI_RETRIES:-1}
    RC_MAX_GEMINI_RETRIES: ${RC_MAX_GEMINI_RETRIES:-1}
    DL_MAX_GEMINI_RETRIES: ${DL_MAX_GEMINI_RETRIES:-1}
    CLAIM_AI_MODEL: ${CLAIM_AI_MODEL:-gemini-2.5-flash-lite}
    CLAIM_MAX_OUTPUT_TOKENS: ${CLAIM_MAX_OUTPUT_TOKENS:-8192}
    CLAIM_MAX_GEMINI_RETRIES: ${CLAIM_MAX_GEMINI_RETRIES:-1}
    CLAIM_MAX_PDF_PAGES: ${CLAIM_MAX_PDF_PAGES:-5}
    NEW_RELIC_APP_NAME: ${NEW_RELIC_WORKER_APP_NAME:-docs-intelligence-worker}
    NEW_RELIC_LOG_FILEPATH: stdout
    NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-true}
    NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
    NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
    OBSERVABILITY_PROVIDER: ${OBSERVABILITY_PROVIDER:-newrelic}
    REDIS_QUEUE_URI: ${REDIS_QUEUE_URI:-redis://valkey:6379}
    REDIS_RATE_LIMIT_URI: ${REDIS_RATE_LIMIT_URI:-redis://valkey:6379}
  depends_on:
    aimodule:
      condition: service_healthy
    valkey:
      condition: service_healthy
  networks:
    - docs
  restart: unless-stopped

services:
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    networks:
      - docs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  aimodule:
    build:
      context: ./aimodule
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      STORAGE_PROVIDER: gcp
      RUN_WORKERS: "false"
      WEBHOOK_URL: ${WEBHOOK_URL:-http://test-backend:3001/api/webhook/extraction-complete}
      WEBHOOK_URL_IN: ${WEBHOOK_URL_IN:-}
      WEBHOOK_URL_COM: ${WEBHOOK_URL_COM:-}
      POLICY_MAX_OUTPUT_TOKENS: ${POLICY_MAX_OUTPUT_TOKENS:-65536}
      POLICY_MAX_GEMINI_RETRIES: ${POLICY_MAX_GEMINI_RETRIES:-1}
      RC_MAX_GEMINI_RETRIES: ${RC_MAX_GEMINI_RETRIES:-1}
      DL_MAX_GEMINI_RETRIES: ${DL_MAX_GEMINI_RETRIES:-1}
      CLAIM_AI_MODEL: ${CLAIM_AI_MODEL:-gemini-3.1-flash-lite}
      CLAIM_MAX_OUTPUT_TOKENS: ${CLAIM_MAX_OUTPUT_TOKENS:-8192}
      CLAIM_MAX_GEMINI_RETRIES: ${CLAIM_MAX_GEMINI_RETRIES:-1}
      CLAIM_MAX_PDF_PAGES: ${CLAIM_MAX_PDF_PAGES:-5}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-docs-intelligence-api}
      NEW_RELIC_LOG_FILEPATH: stdout
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-true}
      NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
      NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
      OBSERVABILITY_PROVIDER: ${OBSERVABILITY_PROVIDER:-newrelic}
      REDIS_QUEUE_URI: ${REDIS_QUEUE_URI:-redis://valkey:6379}
      REDIS_RATE_LIMIT_URI: ${REDIS_RATE_LIMIT_URI:-redis://valkey:6379}
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "${AIMODULE_PORT:-3000}:3000"
    networks:
      - docs
    restart: unless-stopped

  aimodule-worker:
    <<: *aimodule-worker

  aimodule-worker-2:
    <<: *aimodule-worker

  test-backend:
    build:
      context: ./test-backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3001
      NODE_ENV: production
      STORAGE_PROVIDER: r2
      AIMODULE_URL: http://aimodule:3000
      AIMODULE_ADMIN_API_KEY: ${ADMIN_API_KEY}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_PORTAL_APP_NAME:-docs-intelligence-portal}
      NEW_RELIC_LOG_FILEPATH: stdout
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-true}
      NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
      NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
    depends_on:
      aimodule:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - docs
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_URL: ${PUBLIC_URL:-http://localhost}
        VITE_TESTER_API_URL: ${PUBLIC_URL:-http://localhost}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - test-backend
    networks:
      - docs
    restart: unless-stopped

networks:
  docs:
    driver: bridge

volumes:
  valkey_data:
